name: Release

# Push a tag like v2.2.0 to build all three native frontends for Linux, macOS
# and Windows and attach them to a GitHub Release. Publishing to crates.io stays manual.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Build-only dry run when this workflow itself changes (nothing is released).
  pull_request:
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v2.2.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event_name == 'pull_request' && 'pr-test' || github.event.inputs.tag || github.ref_name }}
  BINS: chaos-rpg chaos-rpg-graphical chaos-rpg-proof

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libxkbcommon-dev libgl1-mesa-dev libfontconfig1-dev libwayland-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p chaos-rpg -p chaos-rpg-graphical -p chaos-rpg-proof

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="chaos-rpg-${TAG}-${{ matrix.target }}"
          mkdir "$name"
          for b in $BINS; do cp "target/${{ matrix.target }}/release/$b" "$name/"; done
          cp README.md LICENSE chaos_config.toml "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "chaos-rpg-$env:TAG-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          foreach ($b in $env:BINS.Split(' ')) { Copy-Item "target/${{ matrix.target }}/release/$b.exe" $name }
          Copy-Item README.md, LICENSE, chaos_config.toml $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"

      - name: Smoke test
        shell: bash
        run: |
          for b in $BINS; do "target/${{ matrix.target }}/release/$b" --version; done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            chaos-rpg-*.tar.gz*
            chaos-rpg-*.zip*

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          cat > notes.md <<NOTES
          Prebuilt CHAOS RPG binaries. Each archive holds all three frontends:

          - \`chaos-rpg-graphical\`: the stable tile frontend, recommended for playing
          - \`chaos-rpg-proof\`: the Proof Engine frontend (preview)
          - \`chaos-rpg\`: the terminal frontend

          Pick the file for your system: Windows \`x86_64-pc-windows-msvc.zip\`, Apple Silicon Mac \`aarch64-apple-darwin.tar.gz\`, Intel Mac \`x86_64-apple-darwin.tar.gz\`, Linux \`x86_64-unknown-linux-gnu.tar.gz\`.

          The binaries are not code signed. On Windows, SmartScreen may say "unknown publisher": click More info, then Run anyway. On macOS, right-click the binary and choose Open the first time.

          See CHANGELOG.md for what changed. Verify downloads against SHA256SUMS.txt.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "CHAOS RPG $TAG" --notes-file notes.md
          fi
