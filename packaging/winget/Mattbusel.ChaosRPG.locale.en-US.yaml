ShortDescription: A roguelike where every roll is a chain of real math (Lorenz, Mandelbrot, Collatz).
Description: |-
  CHAOS RPG is a roguelike where every hit, heal and loot drop is decided by chaining real
  math engines (the Lorenz attractor, the Mandelbrot set, the logistic map, Collatz, Riemann zeta)
  instead of a random number. Installs three programs: chaos-rpg-graphical (the game in its own
  window), chaos-rpg-proof (the Proof Engine version, preview) and chaos-rpg (the terminal version).
